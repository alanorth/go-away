# 2025-12-08: Based on examples/generic.yml

# Example cmdline (forward requests from upstream to port :8080)
# $ go-away --bind :8080 --backend site.example.com=http://site:3000 --policy examples/generic.yml --policy-snippets example/snippets/ --challenge-template anubis



# Define networks to be used later below
networks:
  # Networks will get included from snippets

  self:
    # public addresses for things like Drupal running on other vhosts, ie if you
    # have cron jobs etc that need to be allowed.
    - prefixes:
      - "x.x.x.x/32"
      - "xxxx:xxx::xxx:xxx:xxx:xxxx"

challenges:
  # Challenges will get included from snippets

conditions:
  # Conditions will get replaced on rules AST when found as ($condition-name)

  # Conditions will get included from snippets

  is-static-asset:
    # Note that we need to double escape the backslash in CEL expressions
    - 'path.matches("\\.(avif|css|gif|js|json|jpeg|jpg|manifest|mjs|mp4|png|svg|ttf|wasm|webm|webp|woff|woff2)$")'

  is-suspicious-crawler:
    - 'userAgent.contains("Trident/")'
    # Old IE browsers
    - 'userAgent.matches("MSIE ([2-9]|10|11)\\.")'
    # Old Linux browsers
    - 'userAgent.matches("Linux i[63]86") || userAgent.matches("FreeBSD i[63]86")'
    # Old Windows browsers
    - 'userAgent.matches("Windows (3|95|98|CE)") || userAgent.matches("Windows NT [1-5]\\.")'
    # Old mobile browsers
    - 'userAgent.matches("Android [1-5]\\.") || userAgent.matches("(iPad|iPhone) OS [1-9]_")'
    #- 'userAgent.matches("Gecko/(201[0-9]|200[0-9])")'
    - 'userAgent.matches("^Mozilla/[1-4]")'
    # Old Chrome (versions x, xx, and 10x/11x/12x/13x). Version 139 was released in 2025-08
    - 'userAgent.matches("Chrome/\\d{1,2}\\.") || userAgent.matches("Chrome/1[0123]\\d\\.")'
    # Old Firefox (versions x, xx, and 10x/11x/12x/13x/14x), except ESR versions 115 and 140
    - '(userAgent.matches("Firefox/\\d{1,2}\\.") || userAgent.matches("Firefox/1[01234]\\d\\.")) && !userAgent.matches("Firefox/1(15|40)\\.")'

  is-heavy-resource:
    # Exact path match for one of the search pages AND some query parameters.
    # Note: it seems ALL bots request at least one search facet ie f[0] so this
    # should be reliable.
    - 'path == "/datasets" && "f[0]" in query'
    - 'path == "/publications" && "f[0]" in query'
    - 'path == "/search" && "f[0]" in query'
    - 'path == "/tools-methods-manuals" && "f[0]" in query'
    - 'path == "/training" && "f[0]" in query'

# Rules are checked sequentially in order, from top to bottom
rules:
  - name: allow-well-known-resources
    conditions:
      # See: examples/snippets-ilri/conditions-generic.yml
      - '($is-well-known-asset)'
      # Allow monitoring of search API
      - 'path == "/search_api/monitor/server"'
      # Allow Google site verification
      - 'path == "/google00bc96e34599ee92.html"'
    action: pass

  - name: allow-static-resources
    conditions:
      - '($is-static-asset)'
    action: pass

  - name: desired-crawlers
    conditions:
      - *is-bot-googlebot
      - *is-bot-bingbot
      - *is-bot-duckduckbot
      - *is-bot-kagibot
      - *is-bot-qwantbot
      - *is-bot-yandexbot
      - *is-bot-uptimerobot
      - *is-bot-opera-mini
      - *is-bot-facebook-share
      - *is-bot-chatgpt-user
      - *is-bot-applebot
      - *is-bot-ccbot
      - *is-bot-altmetric
      - *is-bot-claude-user
      - *is-bot-perplexity-bot
      - *is-bot-perplexity-user
      - 'remoteAddress.network("good")'
      - 'remoteAddress.network("self")'
    action: pass

  # These are defined in examples/snippets-ilri/networks-other.yml
  - name: undesired-networks
    conditions:
      - 'remoteAddress.network("gptbot")'
      - 'remoteAddress.network("aws-cloud")'
      - 'remoteAddress.network("azure-cloud")'
      - 'remoteAddress.network("cloudflare")'
      - 'remoteAddress.network("digitalocean")'
      - 'remoteAddress.network("google-cloud")'
      - 'remoteAddress.network("linode")'
      - 'remoteAddress.network("oracle-cloud")'
      - 'remoteAddress.network("vultr")'
      # Other datacenters
      - 'remoteAddress.network("datacenters")'
    action: deny

  - name: undesired-crawlers
    conditions:
      - '($is-headless-chromium)'
      - 'userAgent.startsWith("Lightpanda/")'
      - 'userAgent.startsWith("masscan/")'
      # Typo'd opera botnet
      - 'userAgent.matches("^Opera/[0-9.]+\\.\\(")'
      # AI bullshit stuff, they do not respect robots.txt even while they read it
      # TikTok Bytedance AI training
      - 'userAgent.contains("Bytedance") || userAgent.contains("Bytespider") || userAgent.contains("TikTokSpider")'
      # Meta AI training; The Meta-ExternalAgent crawler crawls the web for use cases such as training AI models or improving products by indexing content directly.
      - 'userAgent.contains("meta-externalagent/") || userAgent.contains("meta-externalfetcher/") || userAgent.contains("FacebookBot")'
      # Anthropic AI training and usage
      - 'userAgent.contains("ClaudeBot") || userAgent.contains("Claude-SearchBot")'
      # ChatGPT AI crawlers https://platform.openai.com/docs/bots
      - 'userAgent.contains("GPTBot") || userAgent.contains("OAI-SearchBot")'
      # Other AI crawlers
      - 'userAgent.contains("Amazonbot") || userAgent.contains("Google-Extended") || userAgent.contains("PanguBot") || userAgent.contains("AI2Bot") || userAgent.contains("Diffbot") || userAgent.contains("cohere-training-data-crawler") || userAgent.contains("Applebot-Extended")'
      # SEO / Ads and marketing
      - 'userAgent.contains("BLEXBot")'
      - 'userAgent.contains("Scrapy")'
    action: drop

  - name: unknown-crawlers
    conditions:
      # No user agent set
      - 'userAgent == ""'
    action: deny

  ###
  # Begin challenging requests.
  #
  # The "check" action is like "challenge", but continues executing rules after
  # passing. We want these requests to hit the POW challenge early, then go on
  # to be evaluated further along with all other rules below.
  ###

  - name: suspicious-crawlers
    conditions:
      - '($is-suspicious-crawler)'
      - '($is-unrealistic-browser)'
    action: check
    settings:
      challenges: [js-pow-sha256]

  ###
  # In theory "real" users will start being challenged here, though in my exper-
  # ience any requests landing on a search page with facets enabled are bots, as
  # clients who are already on a search page will send facet requests via ajax.
  ###

  - name: heavy-operations
    conditions: ['($is-heavy-resource)']
    action: check
    settings:
      challenges: [js-pow-sha256]

  # Comment this rule out to not challenge tool-like user agents
  #- name: standard-tools
  #  action: challenge
  #  settings:
  #    challenges: [cookie]
  #  conditions:
  #    - '($is-tool-ua)'
  #    - '!($is-generic-browser)'

  ###
  # Light-weight challenges for all other requests. The client is challenged with
  # each one of these challenges in sequence until they pass one. A failure moves
  # to the next challenge in the sequence.
  #
  # In the future we may want to make this a multiple-stage challenge where the
  # client needs to pass several child challenges in a row, as in the example
  # forgejo policy.
  ###

  - name: standard-browser
    action: challenge
    settings:
      challenges: [preload-link, meta-refresh, resource-load, js-refresh]
    conditions:
      - '($is-generic-browser)'

# If end of rules is reached, default is PASS
